server:
  port: 8080

spring:
  profiles:
    active: local

  application:
    name: yoonumbay-backend

  datasource:
    url: jdbc:mariadb://localhost:3306/yoonumbay_db?createDatabaseIfNotExist=true
    username: yoonumbay_user
    password: yoonumbay_password
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        '[format_sql]': true
        dialect: org.hibernate.dialect.MariaDBDialect

  jackson:
    serialization:
      indent-output: true

logging:
  level:
    '[org.springframework.security]': INFO
    '[org.hibernate.SQL]': DEBUG

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

security:
  jwt:
    secret-key: d7d001c4b67d07876ce8d369f25408b46be34f942a7b1f20f7a76aa9eef224492b9b9fe708f3ed69d8466e97678fb283ef6598bd3df01c3f62012b663c5e45d4
    expiration: 86400000 # 24 heures
