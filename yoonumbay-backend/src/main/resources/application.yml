server:
  port: 8080

spring:
  profiles:
    active: local

  application:
    name: yoonumbay-backend

  datasource:
    url: jdbc:mariadb://localhost:3306/yoonumbay_db?createDatabaseIfNotExist=true
    username: yoonumbay_user
    password: yoonumbay_password
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        '[format_sql]': true
        dialect: org.hibernate.dialect.MariaDBDialect

  jackson:
    serialization:
      indent-output: true

logging:
  level:
    '[org.springframework.security]': INFO
    '[org.hibernate.SQL]': DEBUG

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
